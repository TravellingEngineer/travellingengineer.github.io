base_url = "https://travellingengineer.com"
title = "TravellingEngineer"
description = "Advanced system projects"
default_language = "en"
theme = "devlab-theme"
compile_sass = true
build_search_index = true

author = "Ikey Doherty"
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [
  { name = "tags", paginate_by = 10 },
  { name = "authors", feed = true },
]

[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark"

[extra.devlab.announcement]
show = true
key = "rough-website"
label = "Rough website"
message = "Website currently under construction please be patient"
dismissible = false

[extra.devlab.collections.manual]
section = "docs/_index.md"
navigation = [
    { section = "docs/barney/_index.md" }
]

[extra.devlab.navigation]
links = [
    { name = "Home", path = "/" },
    { name = "About", path = "/about/" },
    { name = "Docs", collection = "manual" },
    { name = "Blog", path = "/blog/" },
    { name = "Downloads", path = "/downloads/" }
]

[extra.devlab.brand]
logo_text = "TravellingEngineer"
footer_text = "Ikey Doherty aka the Travelling Engineer"

[extra.devlab.footer]
links_label = "useful links"
links = [
    { name = "github", path = "https://github.com/TravellingEngineer", icon = "github" },
    { name = "email", path = "mailto:travellingengineer@proton.me", icon = "email" }
]
